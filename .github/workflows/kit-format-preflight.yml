name: Inspect public hosted Kit response format

on:
  push:
    branches:
      - feature/fa-kit-catalog-sync-20261026
    paths:
      - '.github/workflows/kit-format-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public-only Kit response checks
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          import re, json
          for kit in ("23f6a60c28", "a076d05399"):
            for ext in ("css", "js"):
              url = "https://kit.fontawesome.com/%s.%s" % (kit, ext)
              try:
                req=Request(url, headers={"User-Agent":"Mozilla/5.0", "Referer":"https://www.w3schools.com/"})
                with urlopen(req, timeout=12) as r:
                  body = r.read(1000000).decode("utf-8","replace")
                  print("PUBLIC_KIT",kit,ext,"status",r.status,"length",len(body),"type",r.headers.get("content-type"))
                  if kit=="23f6a60c28" and ext=="css": print("KIT_CSS_ENTRY",body[:350])
                  print("SIGNALS", [t for t in ("@font-face","css/","familyStyles","fa-solid","kitConfig","FontAwesomeConfig") if t in body])
                  if kit == "23f6a60c28" and ext == "js":
                    print("JS_HEAD",body[:1200])
                    for match in list(re.finditer("fa-solid", body))[:3]:
                      print("STYLE_CONTEXT",body[max(0,match.start()-200):match.end()+200])
                    print("JS_TAIL",body[-300:])
                  if kit == "23f6a60c28" and ext == "js":
                    marker = "window.FontAwesomeKitConfig = "
                    cfg=json.loads(body.split(marker,1)[1].split(";",1)[0])
                    asset = cfg.get("subsetPath")
                    if not asset or not re.fullmatch(r"assets/[a-f0-9]+/[0-9]+/kit\.css",asset):
                      raise ValueError("Unknown Kit asset path")
                    hosted = cfg["baseUrl"].rstrip("/") + "/" + asset + "?token=" + kit
                    with urlopen(Request(hosted, headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as cr:
                      style_sheet=cr.read(4000000).decode("utf-8","replace")
                      print("KIT_CSS_STATUS",cr.status,"BYTES",len(style_sheet))
                      print("FONT_FAMILIES",sorted(set(re.findall(r"font-family\s*:\s*([^;{}]+)",style_sheet)))[:25])
                      print("ICON_SELECTOR_COUNT",len(set(re.findall(r"\.fa-([a-z0-9-]+):before",style_sheet))))
                      print("STYLESHEETH_HEAD",style_sheet[:250])
                  links = re.findall(r'https?://[^\\s]+', body)
                  print("URL_EXAMPLES",links[:5])
              except (HTTPError,URLError) as exc:
                print("PUBLIC_KIT",kit,ext,"error",str(exc))
          PY
