name: PHP smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint PHP
        run: php -l hashe-fa7-elementor/hashe-fa7-elementor.php
      - name: Run PHP smoke tests
        run: php tests/smoke.php
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check editor callback isolation
        run: node tests/editor-callback-guard.test.cjs

      - name: Verify seven unique Elementor categories in actual Chromium DOM
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium-browser)"
          test -n "$BROWSER"
          PROFILE="$(mktemp -d)"
          trap 'rm -rf "$PROFILE"' EXIT
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=2500 --user-data-dir="$PROFILE" \
            --dump-dom "file://$PWD/tests/browser-picker-integrity.html" 2>/dev/null \
            | grep -F '<body data-fa7-qa="pass">'
