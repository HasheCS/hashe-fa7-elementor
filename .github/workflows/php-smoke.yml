name: Release compliance and regression tests
on:
  push:
  pull_request:
jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP lint
        run: |
          php -l hashe-fa7-elementor/hashe-fa7-elementor.php
          php -l hashe-fa7-elementor/includes/catalog-provider.php
          php -l hashe-fa7-elementor/includes/dynamic-family-provider.php
      - name: Test Free, CSS Kits, full JS Kits, version, API fallback and license gates
        run: |
          for scenario in no-kit invalid-kit css-small css-mixed full-pro full-plus css-stale css-api-offline; do
            php tests/smoke.php "$scenario"
          done
  editor-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kit memory regression
        run: |
          node --check hashe-fa7-elementor/assets/js/editor-kit-memory.js
          node tests/editor-kit-memory.test.cjs