name: PHP smoke tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint PHP
        run: php -l hashe-fa7-elementor/hashe-fa7-elementor.php
      - name: Run smoke tests
        run: php tests/smoke.php
